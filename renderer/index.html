<!doctype html>
<html>
  <head>
    <title>9597 PLAYLIST</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <button id="playlistBtn" class="menu-btn">☰</button>
    <button id="likedToggleBtn" class="menu-btn" style="top: 70px">
      <i class="fa-solid fa-heart"></i>
    </button>
    <button id="uploadBtn" class="upload-btn">
      <i class="fa-solid fa-upload"></i>
      <span class="tooltip">Upload your own song with cover</span>
    </button>

    <button id="createPlaylistBtn">+</button>

    <div id="playlistModal" class="upload-modal">
      <div class="upload-box">
        <h3>Create Playlist</h3>

        <input
          type="text"
          id="playlistNameInput"
          placeholder="Enter your playlist Name"
        />
        <div class="upload-actions">
          <button id="createPlaylistConfirm">Create</button>
          <button id="createPlaylistCancel">Cancel</button>
        </div>
      </div>
    </div>

    <div id="mainContent">
      <h2>9597 Music Player🎶</h2>

      <audio id="audio"></audio>
      <div id="song-title">Select a song</div>

      <img id="albumArt" />

      <button id="likeBtn" class="like-btn">
        <i class="fa-regular fa-heart"></i>
      </button>

      <div class="controls">
        <button onclick="prevSong()">⏮</button>
        <button id="playPauseBtn" onclick="playPause()">▶</button>
        <button onclick="nextSong()">⏭</button>
      </div>
      <input type="range" id="progress" value="0" />

      <div id="timeDisplay">
        <span id="currentTime">0:00</span>
        <span id="duration"></span>
      </div>
    </div>
    <div id="playlistContainer" class="sidebar">
      <input type="text" id="searchInput" placeholder="Search Song..." />

      <div id="allSongsSection">
        <ul id="playlist"></ul>
      </div>

      <div id="likedSection" style="display: none">
        <ul id="likedPlaylist"></ul>
      </div>
    </div>

    <div id="miniPlayer">
      <img id="miniArt" src="images/default.png" />
      <div class="mini-info">
        <span id="miniTitle">No Song</span>
      </div>
      <button id="shuffleBtn" onclick="toggleShuffle()">⇄</button>
      <button id="repeatBtn">↻</button>
      <button id="miniplayPauseBtn" onclick="playPause()">▶</button>
    </div>

    <div id="uploadModal" class="upload-modal">
      <div class="upload-box">
        <h3>Upload Song</h3>
        <input
          type="text"
          id="songNameInput"
          placeholder="Enter your song name.."
        />

        <div class="file-group">
          <label class="custom-file">
            Choose Audio
            <input type="file" id="audioUpload" accept=".mp3" hidden />
          </label>
          <span id="audioFileName">No File Chosen</span>
        </div>

        <div class="file-group">
          <label class="custom-file">
            Choose Cover
            <input
              type="file"
              id="coverUpload"
              accept=".jpg, .jpeg, .png"
              hidden
            />
          </label>
          <span id="coverFileName">No File Chosen</span>
        </div>

        <div class="upload-actions">
          <button id="uploadConfirm">OK</button>
          <button id="uploadCancel">Cancel</button>
        </div>
      </div>
    </div>
    <div id="toast"></div>
    <script src="renderer.js"></script>
  </body>
</html>
