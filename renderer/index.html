<!doctype html>
<html>
  <head>
    <title>9597 PLAYLIST</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <button id="playlistBtn" class="menu-btn">☰</button>
    <div id="mainContent">
      <h2>9597 Music Player🎶</h2>

      <audio id="audio"></audio>
      <div id="song-title">Select a song</div>

      <img id="albumArt" />

      <div class="controls">
        <button onclick="prevSong()">⏮</button>
        <button id="playPauseBtn" onclick="playPause()">▶</button>
        <button onclick="nextSong()">⏭</button>
      </div>
      <input type="range" id="progress" value="0" />

      <div id="timeDisplay">
        <span id="currentTime">0:00</span>
        <span id="duration"></span>
      </div>
    </div>
    <div id="playlistContainer" class="sidebar">
      <input type="text" id="searchInput" placeholder="Search Song..." />
      <ul id="playlist"></ul>
    </div>

    <div id="miniPlayer">
      <img id="miniArt" src="images/default.png" />
      <div class="mini-info">
        <span id="miniTitle">No Song</span>
      </div>
      <button id="shuffleBtn" onclick="toggleShuffle()">⇄</button>
      <button id="repeatBtn">↻</button>
      <button id="playPauseBtn" onclick="playPause()">▶</button>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
